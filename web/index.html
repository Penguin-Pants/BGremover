<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BGremover</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f8;
    --fg: #1a1a1a;
    --muted: #6b6b70;
    --accent: #2563eb;
    --border: #d8d8dc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a;
      --fg: #f0f0f2;
      --muted: #9a9aa2;
      --border: #303036;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
    padding: 3rem 1.5rem;
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  h1 { font-size: 1.25rem; margin: 0; }
  p.tagline { color: var(--muted); margin: -1rem 0 0; text-align: center; }
  #dropzone {
    width: min(480px, 100%);
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 2.5rem 1.5rem;
    text-align: center;
    color: var(--muted);
    cursor: pointer;
    transition: border-color 0.15s, opacity 0.15s;
  }
  #dropzone.dragover { border-color: var(--accent); color: var(--accent); }
  #dropzone.disabled { pointer-events: none; opacity: 0.5; }
  #cv {
    max-width: min(480px, 100%);
    max-height: 60vh;
    background:
      linear-gradient(45deg, #ccc 25%, transparent 25%) -8px 0/16px 16px,
      linear-gradient(-45deg, #ccc 25%, transparent 25%) -8px 0/16px 16px,
      linear-gradient(45deg, transparent 75%, #ccc 75%) -8px 0/16px 16px,
      linear-gradient(-45deg, transparent 75%, #ccc 75%) -8px 0/16px 16px;
    border-radius: 8px;
    display: none;
  }
  #cv.visible { display: block; }
  #status { color: var(--muted); min-height: 1.2em; }
  #dl {
    font: inherit;
    padding: 0.5rem 1.25rem;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: white;
    cursor: pointer;
  }
  #dl:disabled { opacity: 0.4; cursor: default; }
  #file-input { display: none; }
</style>
</head>
<body>
  <h1>BGremover</h1>
  <p class="tagline">Remove image backgrounds locally. Nothing is uploaded.</p>

  <div id="dropzone">
    Drop an image here, or click to choose one
    <input id="file-input" type="file" accept="image/*" />
  </div>

  <canvas id="cv"></canvas>
  <div id="status"></div>
  <button id="dl" disabled>Download PNG</button>

  <script type="module" src="./app.js"></script>
</body>
</html>
